<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XG TikTok Downloader</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ff0050,#000);
    color:white;
    text-align:center;
    padding:40px;
}

.container{
    background: rgba(0,0,0,0.6);
    padding:30px;
    border-radius:15px;
    max-width:500px;
    margin:auto;
}

input{
    width:90%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:15px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#00f2ea;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:white;
}

#result{
    margin-top:20px;
}
a{
    color:#00f2ea;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">
    <h2>🔥 XG TikTok Downloader</h2>
    <input type="text" id="url" placeholder="Paste TikTok Video Link">
    <br>
    <button onclick="download()">Download</button>

    <div id="result"></div>
</div>

<script>
async function download(){

    const url = document.getElementById("url").value;

    if(!url){
        alert("Paste TikTok Link First");
        return;
    }

    const api = "https://api-26sm.onrender.com/api?url="
                + encodeURIComponent(url)
                + "&apikey=xg_superfast_2026";

    const res = await fetch(api);
    const data = await res.json();

    if(data.error){
        document.getElementById("result").innerHTML = "❌ Video Not Found";
        return;
    }

    document.getElementById("result").innerHTML = `
        <p><b>${data.title}</b></p>
        <p>By: ${data.author}</p>
        <a href="${data.nowm}" target="_blank">⬇ Download No Watermark</a>
    `;
}
</script>

</body>
</html>
