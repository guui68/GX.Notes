<script>
    async function downloadVideo() {
        const urlInput = document.getElementById('videoUrl').value;
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        
        if (!urlInput) {
            alert("দয়া করে একটি লিঙ্ক পেস্ট করুন");
            return;
        }

        resultDiv.innerHTML = "";
        loader.style.display = "block";

        // --- API সেটআপ ---
        const apiKey = 'c7111d53a3mshd5e404dc3c025d3p12614djsn594c67457ff9'; 
        
        // ভিডিওর আইডি বের করার চেষ্টা (লিঙ্ক থেকে)
        const parts = urlInput.split('/');
        const shortcode = parts[parts.length - 2]; 

        // নতুন এন্ডপয়েন্ট: mediaByShortcode
        const apiUrl = `https://instagram120.p.rapidapi.com/api/instagram/mediaByShortcode?shortcode=${shortcode}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'GET', // GET মেথড ব্যবহার করা হচ্ছে
                headers: {
                    'x-rapidapi-host': 'instagram120.p.rapidapi.com',
                    'x-rapidapi-key': apiKey
                }
            });

            const data = await response.json();
            loader.style.display = "none";
            
            console.log(data); // ব্রাউজারের কনসোলে কী ডেটা আসছে তা দেখুন

            // --- API রেসপন্স অনুযায়ী ডাউনলোডের লিঙ্ক দেখানো ---
            // এই ডাটা স্ট্রাকচার API-এর ওপর নির্ভর করে
            if (data.media && data.media.video_versions) {
                const downloadLink = data.media.video_versions[0].url; // সবচেয়ে ভালো কোয়ালিটি
                resultDiv.innerHTML = `
                    <p style="color: green;">ভিডিও পাওয়া গেছে!</p>
                    <a href="${downloadLink}" target="_blank">
                        <button style="background-color: #28a745;">ভিডিও ডাউনলোড করুন</button>
                    </a>
                `;
            } else {
                resultDiv.innerHTML = "<p style='color: red;'>ভিডিও পাওয়া যায়নি। লিঙ্কটি সঠিক কিনা চেক করুন।</p>";
            }
        } catch (error) {
            loader.style.display = "none";
            resultDiv.innerHTML = "<p style='color: red;'>এরর হয়েছে। API কাজ করছে না।</p>";
            console.error(error);
        }
    }
                    </script>
