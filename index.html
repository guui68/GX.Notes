<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XG Premium TikTok Downloader</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#ff0050,#000);
    color:white;
    text-align:center;
    padding:30px;
}

/* Premium Card Design */
.container{
    background: rgba(0,0,0,0.65);
    padding:30px;
    border-radius:25px;
    max-width:500px;
    margin:auto;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

/* Input Box */
input{
    width:90%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:15px;
    font-size:16px;
}

/* Button Style */
button{
    margin-top:20px;
    padding:14px 30px;
    border:none;
    border-radius:12px;
    background:#00f2ea;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:white;
}

/* Status Text */
#status{
    margin-top:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>🔥 XG Premium TikTok Downloader</h2>

<p>Paste TikTok Video Link Below</p>

<input type="text" id="url" placeholder="Enter TikTok Video Link">

<br>

<button onclick="downloadVideo()">⬇ Download Now</button>

<p id="status"></p>

</div>

<script>

async function downloadVideo(){

const url = document.getElementById("url").value;

if(!url){
alert("Please Paste TikTok Link");
return;
}

document.getElementById("status").innerText="Processing Download...";

const api = "https://api-26sm.onrender.com/api?url="
+ encodeURIComponent(url)
+ "&apikey=xg_superfast_2026";

const res = await fetch(api);
const data = await res.json();

if(data.nowm){

// ⭐ Direct Download Start
const a = document.createElement("a");
a.href = data.nowm;
a.download = "tiktok_video.mp4";
document.body.appendChild(a);
a.click();
a.remove();

document.getElementById("status").innerText="✅ Download Started!";

}else{

document.getElementById("status").innerText="❌ Video Not Found";

}

}

</script>

</body>
</html>
