<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XG Notes Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f1f3f4;
}

/* Login */
.center{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:25px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card input{
width:100%;
padding:10px;
margin:10px 0;
}

.card button{
padding:8px 15px;
background:#fbbc04;
border:none;
border-radius:6px;
cursor:pointer;
}

/* App */
.topbar{
display:flex;
justify-content:space-between;
padding:15px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.search{
margin:15px;
padding:10px;
width:90%;
border:1px solid #ddd;
border-radius:8px;
}

.notes{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
padding:15px;
}

.note{
background:#fff475;
padding:15px;
border-radius:12px;
position:relative;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
word-wrap:break-word;
}

.note small{
display:block;
margin-top:10px;
font-size:12px;
color:gray;
}

.delete{
position:absolute;
top:5px;
right:8px;
cursor:pointer;
color:red;
}

.fab{
position:fixed;
bottom:25px;
right:25px;
width:55px;
height:55px;
border-radius:50%;
background:#fbbc04;
border:none;
font-size:22px;
cursor:pointer;
}

/* Modal */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:20px;
border-radius:12px;
width:90%;
max-width:400px;
}

.modal textarea{
width:100%;
height:120px;
padding:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="center">
<div class="card">
<h2 id="title">Set Password</h2>
<input type="password" id="passwordInput" placeholder="Enter Password">
<button onclick="handlePassword()">Continue</button>
<p id="error" style="color:red;"></p>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
<div class="topbar">
<h2>XG Notes Pro</h2>
<button onclick="logout()">Logout</button>
</div>

<input type="text" placeholder="Search..." oninput="searchNotes(this.value)" class="search">

<div id="notesContainer" class="notes"></div>

<button class="fab" onclick="openModal()">+</button>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">
<textarea id="noteText" placeholder="Write note..."></textarea>
<button onclick="saveNote()">Save</button>
</div>
</div>

<script>
let savedPassword = localStorage.getItem("xg_password");
let notes = JSON.parse(localStorage.getItem("xg_notes")) || [];

if(savedPassword){
document.getElementById("title").innerText="Enter Password";
}

function handlePassword(){
let input=document.getElementById("passwordInput").value.trim();
if(!input) return;

if(!savedPassword){
localStorage.setItem("xg_password",input);
savedPassword=input;
openApp();
}else{
if(input===savedPassword){
openApp();
}else{
document.getElementById("error").innerText="Wrong Password!";
}
}
}

function openApp(){
document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";
renderNotes();
}

function logout(){
location.reload();
}

function openModal(){
document.getElementById("modal").style.display="flex";
}

function saveNote(){
let text=document.getElementById("noteText").value.trim();
if(!text) return;

notes.push({text:text,time:Date.now()});
localStorage.setItem("xg_notes",JSON.stringify(notes));

document.getElementById("noteText").value="";
document.getElementById("modal").style.display="none";
renderNotes();
}

function deleteNote(index){
notes.splice(index,1);
localStorage.setItem("xg_notes",JSON.stringify(notes));
renderNotes();
}

function renderNotes(filtered=notes){
let container=document.getElementById("notesContainer");
container.innerHTML="";

filtered.sort((a,b)=>b.time-a.time);

filtered.forEach((note,index)=>{
let div=document.createElement("div");
div.className="note";
div.innerHTML=`
<span class="delete" onclick="deleteNote(${index})">✖</span>
${note.text}
<small>${new Date(note.time).toLocaleString()}</small>
`;
container.appendChild(div);
});
}

function searchNotes(value){
let filtered=notes.filter(n=>n.text.toLowerCase().includes(value.toLowerCase()));
renderNotes(filtered);
}

window.onclick=function(e){
if(e.target.id==="modal"){
document.getElementById("modal").style.display="none";
}
}
</script>

</body>
</html>
