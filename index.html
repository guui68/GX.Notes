<script>

async function download(){

const url = document.getElementById("url").value
const result = document.getElementById("result")

result.innerHTML = "Loading..."

const api = "https://api.apify.com/v2/acts/thenetaji~instagram-video-downloader-reels-and-stories/run-sync-get-dataset-items?token=API_TOKEN"

const body = {
urls:[{url:url}],
quality:"best"
}

try{

const res = await fetch(api,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(body)
})

const data = await res.json()

console.log(data)

let video =
data[0]?.videoUrl ||
data[0]?.url ||
data[0]?.video ||
data[0]?.displayUrl

if(!video){

result.innerHTML="Video not found"
return

}

result.innerHTML = ""

const videoPlayer = document.createElement("video")
videoPlayer.src = video
videoPlayer.controls = true
videoPlayer.style.width = "100%"
videoPlayer.style.borderRadius = "10px"

const downloadBtn = document.createElement("a")
downloadBtn.href = video
downloadBtn.target="_blank"
downloadBtn.innerHTML = "Download Video"
downloadBtn.style.display="block"
downloadBtn.style.marginTop="15px"
downloadBtn.style.padding="10px"
downloadBtn.style.background="#00c853"
downloadBtn.style.color="white"
downloadBtn.style.textAlign="center"
downloadBtn.style.borderRadius="8px"
downloadBtn.style.textDecoration="none"

result.appendChild(videoPlayer)
result.appendChild(downloadBtn)

}catch(e){

result.innerHTML="API Error"

}

}

  </script>
