<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Instagram Downloader</title>

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding-top:80px;
}

.container{
    width:400px;
    margin:auto;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    box-shadow:0 0 25px black;
}

input{
    width:100%;
    padding:14px;
    margin:15px 0;
    border-radius:10px;
    border:none;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#238636;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2ea043;
}

</style>

</head>

<body>

<div class="container">

<h2>🚀 Instagram Video Downloader</h2>

<input id="url" placeholder="Paste Instagram Video Link">
<input id="apikey" placeholder="Enter API Key">

<button onclick="downloadVideo()">Download Video</button>

<p id="msg"></p>

</div>

<script>

async function downloadVideo(){

const url=document.getElementById("url").value;
const key=document.getElementById("apikey").value;
const msg=document.getElementById("msg");

msg.innerText="Processing...";

const res=await fetch("https://YOUR-API-URL/download",{
method:"POST",
headers:{
"Content-Type":"application/json",
"x-api-key":key
},
body:JSON.stringify({url})
});

if(res.ok){

const blob=await res.blob();

const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="instagram_video.mp4";
a.click();

msg.innerText="Download Complete ✅";

}else{
msg.innerText="Download Failed ❌";
}

}

</script>

</body>
</html>
