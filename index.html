<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাবলিক ইন্সটাগ্রাম ডাউনলোডার</title>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .main-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 90%; max-width: 500px; }
        h2 { color: #333; margin-bottom: 25px; }
        .input-box { display: flex; gap: 10px; flex-wrap: wrap; }
        input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: 0.3s; min-width: 200px; }
        input:focus { border-color: #e1306c; }
        button { background-color: #e1306c; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; flex-shrink: 0; }
        button:hover { background-color: #c13584; }
        #statusMessage { margin-top: 15px; font-size: 14px; color: #555; }
        .download-btn { display: inline-block; margin-top: 20px; background-color: #25d366; color: white; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>পাবলিক ইন্সটাগ্রাম ডাউনলোডার</h2>
        <div class="input-box">
            <input type="text" id="videoUrl" placeholder="ইন্সটাগ্রাম লিঙ্ক পেস্ট করুন...">
            <button onclick="fetchDownloadLink()">ডাউনলোড</button>
        </div>
        
        <div id="statusMessage"></div>
        <div id="resultArea"></div>
    </div>

    <script>
        async function fetchDownloadLink() {
            const videoUrl = document.getElementById('videoUrl').value;
            const statusMessage = document.getElementById('statusMessage');
            const resultArea = document.getElementById('resultArea');

            if (!videoUrl) {
                statusMessage.innerText = "দয়া করে একটি লিঙ্ক পেস্ট করুন।";
                return;
            }

            statusMessage.innerText = "ভিডিও লিঙ্ক প্রসেস করা হচ্ছে, দয়া করে অপেক্ষা করুন...";
            resultArea.innerHTML = "";

            // --- পাবলিক API ব্যবহার ---
            // এই API টি কী (Key) ছাড়াই কাজ করে।
            const apiUrl = `https://api.vreden.dev/insta?url=${encodeURIComponent(videoUrl)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'success' && data.result) {
                    statusMessage.innerText = "লিঙ্ক সফলভাবে তৈরি হয়েছে!";
                    // সরাসরি ডাউনলোডের লিঙ্ক
                    const downloadUrl = data.result; 
                    resultArea.innerHTML = `<a href="${downloadUrl}" target="_blank" class="download-btn">ভিডিও ডাউনলোড করুন</a>`;
                } else {
                    statusMessage.innerText = "ভিডিওটি পাওয়া যায়নি। লিঙ্কটি সঠিক কিনা চেক করুন।";
                }
            } catch (error) {
                console.error(error);
                statusMessage.innerText = "একটি ত্রুটি হয়েছে। আবার চেষ্টা করুন।";
            }
        }
    </script>

</body>
</html>
