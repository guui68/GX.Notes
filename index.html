<!DOCTYPE html>
<html>
<head>
<title>Instagram Video Downloader</title>
<style>
body{
font-family:Arial;
text-align:center;
background:#111;
color:white;
padding:50px;
}

input{
width:70%;
padding:10px;
font-size:16px;
}

button{
padding:10px 20px;
font-size:16px;
background:#ff004f;
color:white;
border:none;
cursor:pointer;
}

#result{
margin-top:20px;
}
</style>
</head>

<body>

<h1>Instagram Video Downloader</h1>

<input id="url" placeholder="Paste Instagram Link">

<br><br>

<button onclick="download()">Download</button>

<div id="result"></div>

<script>

async function download(){

let url = document.getElementById("url").value

let api = "https://nativeig.vercel.app/api/video?postUrl=" + url

try{

let res = await fetch(api)
let data = await res.json()

let video = data.videoUrl || data.url

document.getElementById("result").innerHTML = `
<a href="${video}" target="_blank">
<button>Download Video</button>
</a>
`

}catch{

document.getElementById("result").innerHTML="API Error"

}

}

</script>

</body>
</html>
