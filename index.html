<script>

async function download(){

let url = document.getElementById("url").value
let result = document.getElementById("result")

result.innerHTML="Loading video..."

let api = "https://api.apify.com/v2/acts/thenetaji~instagram-video-downloader-reels-and-stories/run-sync-get-dataset-items?token=API_TOKEN"

let body = {
urls:[{url:url}],
quality:"best"
}

try{

let res = await fetch(api,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(body)
})

let data = await res.json()

console.log(data)

let video = data[0].videoUrl || data[0].displayUrl || data[0].url

result.innerHTML=`

<video width="100%" controls>
<source src="${video}" type="video/mp4">
</video>

<br><br>

<a href="${video}" target="_blank" download>
<button>Download Video</button>
</a>

`

}catch{

result.innerHTML="Video load failed"

}

}

               </script>
